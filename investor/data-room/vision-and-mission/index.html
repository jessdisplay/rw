 knowing which parts of the story are already landing.\"}]},{\"heading\":\"What kind of company we are building\",\"blocks\":[{\"kind\":\"p\",\"text\":\"The leading compliance platform for regulated care. The ambition is to become the trusted platform that providers rely on to demonstrate compliance and auditors rely on to assess it. We start by helping providers. We strengthen the experience for auditors. Long term, the aim is to support compliance across Australia's regulated care sectors.\"},{\"kind\":\"caution\",\"text\":\"\\\"We start by helping providers, we strengthen the experience for auditors\\\" is the closest the document comes to answering Matt's pick-one challenge, and it points at PROVIDERS FIRST. The public marketing site says the opposite: \\\"the audit platform for both sides of the table\\\", two audiences equally. One of them has to change. [[NEEDS INPUT — Leadership]]\"},{\"kind\":\"caution\",\"text\":\"Matt, on focus: \\\"If this is the business you truly want to build, focusing on this, and only this, is what you need to do. Robots and community building is cool, but it won't build you this business. My question: what kind of company do you really want to build? What really matters to you? If the answer is still solving this compliance problem, print this sentence out and stick it on the wall.\\\"\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"10:I[15637,[\"/rw/_next/static/chunks/12b9~mg3o6lnh.js\",\"/rw/_next/static/chunks/0xs8ni7jz0o1p.js\"],\"IconMark\"]\n7:null\nc:[[\"$\",\"title\",\"0\",{\"children\":\"Vision and mission - Rise data room\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"Why Rise exists and what kind of company is being built. Matt marked this section as the strongest in the document and asked that the others
