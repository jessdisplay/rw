dence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]]],\"S\":true,\"h\":null,\"s\":\"$undefined\",\"l\":\"$undefined\",\"p\":\"$undefined\",\"d\":\"$undefined\",\"b\":\"ZdkJM66LK9j_UqSkysVmq\"}\n"])</script><script>self.__next_f.push([1,"e:[]\n8:\"$We\"\n"])</script><script>self.__next_f.push([1,"f:I[73844,[\"/rw/_next/static/chunks/12b9~mg3o6lnh.js\",\"/rw/_next/static/chunks/0xs8ni7jz0o1p.js\",\"/rw/_next/static/chunks/0nfzvq7-u49z8.js\",\"/rw/_next/static/chunks/0v~uq.dtky9r_.js\",\"/rw/_next/static/chunks/04umgrs7-j_80.js\"],\"DataRoomDocument\"]\n"])</script><script>self.__next_f.push([1,"4:[\"$\",\"$Lf\",null,{\"doc\":{\"slug\":\"the-proposition\",\"title\":\"The proposition\",\"summary\":\"What problem Rise solves, for whom, and why they need it. The current source of truth widens the scope beyond NDIS to the whole regulated care sector including aged care. Matt's central open challenge sits on this page: providers and auditors are different problems, and one has to be chosen.\",\"meta\":{\"docType\":\"Scope\",\"status\":\"Draft\",\"owner\":\"Leadership\",\"sector\":\"Cross-Sector\",\"version\":\"0.1\",\"lastReviewed\":\"2026-08-22\",\"source\":\"Rise Strategic Roadmap (2026-2027), working draft with Matthew Simmonds, 86k\",\"asAt\":\"July 2026, with eleven open advisor comments\",\"sourceUrl\":\"https://docs.google.com/document/d/1JaQEhnMeqZtY699QWDCZ2hfCFWGLMlj3Lr5-bT7_Lb4/edit\",\"sourceLabel\":\"The strategic roadmap in Drive\"},\"related\":[\"problem-and-why-now\",\"advisor-review\"],\"sections\":[{\"heading\":\"Exactly what problem are we solving\",\"blocks\":[{\"kind\":\"p\",\"text\":\"Australia's regulated care sector is undergoing one of the most significant regulatory reforms in its history. Mandatory registration is already underway across both the NDIS and aged care. Over the coming four years, hundreds of thousands of organisations will progressively move into a regulated environment, requiring them to continuously demonstrate compliance against increasingly rigorous standards.\"},{\"kind\":\"p\",\"text\":\"Today's compliance model is fragmented, manual and reactive. Providers manage policies in documents, registers in spreadsheets and evidence across emails, cloud storage and shared drives. Auditors receive information in a different format from every organisation, making reviews inconsistent, time consuming and expensive. Compliance has become an administrative burden rather than a quality improvement process.\"},{\"kind\":\"p\",\"text\":\"Rise exists to modernise how compliance is demonstrated and assessed.\"},{\"kind\":\"caution\",\"text\":\"Matt's comment on \\\"hundreds of thousands\\\": \\\"is this known to be 245k? If so, put that in.\\\" It is known, and the marketing site already says 245,000. The source-of-truth document is vaguer than the public website. [[NEEDS INPUT — Leadership]]\"}]},{\"heading\":\"Who we solve it for\",\"blocks\":[{\"kind\":\"table\",\"head\":[\"Horizon\",\"Audience\"],\"rows\":[[\"Today\",\"NDIS providers. Aged care providers. Approved Quality Auditors.\"],[\"Tomorrow\",\"Other regulated care sectors. International markets with similar regulatory frameworks.\"]]},{\"kind\":\"caution\",\"text\":\"Matt, on this exact list: \\\"Last week, we discussed the fact that the solution for auditors needs to be very different from the solution for NDIS providers. Which are you going after today and why? Can you more clearly define the first beachhead market... Choose one for Today, put the other 2 into Tomorrow, put the others in Future.\\\" Unresolved. [[NEEDS INPUT — Leadership]]\"}]},{\"heading\":\"Why they need us\",\"blocks\":[{\"kind\":\"ul\",\"items\":[\"Providers need a simpler way to demonstrate compliance without spending countless hours managing documentation.\",\"Auditors need structured, consistent and reliable evidence so they can spend more time assessing quality and less time gathering information.\",\"Regulators benefit from greater transparency, consistency and confidence across the sectors they oversee.\"]},{\"kind\":\"p\",\"text\":\"Rise is not a CRM. It is not an ERP. It is not practice management software. It solves one problem exceptionally well.\"},{\"kind\":\"caution\",\"text\":\"Matt on that last line: \\\"I love this sentence. But I think you are talking about solving multiple problems! Are you making it easier for auditors to audit or for providers to demonstrate compliance quickly? Yes, these two things might be linked but they are fundamentally different problems and different stakeholders. Pick one, execute it exceptionally well.\\\" [[NEEDS INPUT — Leadership]]\"}]}]}}]\n"])</script><script>self.__next_f.push([1,"a:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n"])</script><script>self.__next_f.push([1,"10:I[15637,[\"/rw/_next/static/chunks/12b9~mg3o6lnh.js\",\"/rw/_next/static/chunks/0xs8ni7jz0o1p.js\"],\"IconMark\"]\n7:null\nc:[[\"$\",\"title\",\"0\",{\"children\":\"The proposition - Rise data room\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"What problem Rise solves, for whom, and why they need it. The current source of truth widens the scope beyond NDIS to the whole regulated care sector including aged care. Matt's central open challenge sits on this page: providers and auditors are different problems, and one has to be chosen.\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"noindex, nofollow\"}],[\"$\",\"link\",\"3\",{\"rel\":\"icon\",\"href\":\"/rw/favicon.ico?favicon.0x3dzn~oxb6tn.ico\",\"sizes\":\"256x256\",\"type\":\"image/x-icon\"}],[\"$\",\"link\",\"4\",{\"rel\":\"icon\",\"href\":\"/rw/icon.svg?icon.0f__wm_39.e86.svg\",\"sizes\":\"any\",\"type\":\"image/svg+xml\"}],[\"$\",\"$L10\",\"5\",{}]]\n"])</script></body></html>
